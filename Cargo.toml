[package]
name = "llmapi"
version = "0.1.8"
edition = "2024"
authors = ["Mozhu <mozhu233@outlook.com>"]
description = "Multi-provider LLM API protocol conversion proxy"
license = "MIT"
repository = "https://github.com/virzz/llmapi-rs"
homepage = "https://github.com/virzz/llmapi-rs"
documentation = "https://docs.rs/llmapi"

[lib]
path = "src/lib.rs"

[[bin]]
name = "llmapi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
comfy-table = "8"
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = { version = "0.8.4", default-features = false }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
daemon = { git = "https://github.com/virzz/daemon-rs", tag = "v0.1.2" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
